version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dist
    command: worker
    environment:
      - CELERY_BROKER_URL=amqp://user:password@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=hope_live.config.settings
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dist
    command: beat
    environment:
      - CELERY_BROKER_URL=amqp://user:password@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=hope_live.config.settings
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dist
    command: flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=amqp://user:password@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=hope_live.config.settings
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
