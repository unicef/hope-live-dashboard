  <div id="map"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const width = 400;
      const height = 300;

      const projection = d3.geoMercator()
        .scale(50)
        .translate([width / 2, height / 2 ]);

      const path = d3.geoPath().projection(projection);

      const svg = d3.create("svg")
        .attr("width", width)
        .attr("height", height);

      const data = [
        [40.7128, -74.0060, 10, "red"], // New York
        [34.0522, -118.2437, 15, "blue"], // Los Angeles
        [48.8566, 2.3522, 8, "green"], // Paris
        [35.6895, 139.6917, 12, "purple"] // Tokyo
      ];

      d3.json("https://unpkg.com/world-atlas@2.0.2/countries-110m.json").then(world => {
        const countries = topojson.feature(world, world.objects.countries);

        svg.selectAll(".country")
          .data(countries.features)
          .enter().append("path")
          .attr("class", "country")
          .attr("d", path);

        svg.selectAll("circle")
          .data(data)
          .enter().append("circle")
          .attr("cx", d => projection([d[1], d[0]])[0])
          .attr("cy", d => projection([d[1], d[0]])[1])
          .attr("r", d => d[2])
          .attr("fill", d => d[3])
          .attr("opacity", 0.7);

        document.getElementById("map").appendChild(svg.node());
      });
    });
  </script>
