{% extends "layout.html" %}
{% load i18n %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 lg:px-6 py-8">
    <a href="{% url 'web:index' %}#latest-updates"
       class="text-sm text-unicef-blue-dark font-bold hover:underline inline-flex items-center gap-1 mb-4">
        <svg class="w-3.5 h-3.5 rtl:rotate-180" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
        </svg>
        <span>{% translate "Back to latest updates" %}</span>
    </a>

    <div class="bg-white rounded-lg border border-black/10 shadow-sm p-6 lg:p-8">
        <h1 class="text-3xl font-bold text-black tracking-tight leading-tight">{{ update.version }}</h1>
        {% if update.date %}
        <p class="text-sm text-black/50 mt-1 mb-4">{{ update.date|date:"F j, Y" }}</p>
        {% endif %}
        <div class="text-base text-black/80 leading-relaxed">{{ update.description|linebreaks }}</div>

        <div class="mt-6 pt-4 border-t border-black/10">
            <a href="https://www.unicef.org/hope-hct/" target="_blank" rel="noopener"
               class="text-sm text-unicef-blue-dark font-bold hover:underline">
                {% translate "View all HOPE releases" %}
            </a>
        </div>
    </div>
</div>
{% endblock content %}
