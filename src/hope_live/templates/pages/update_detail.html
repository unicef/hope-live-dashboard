{% extends "layout.html" %}
{% load i18n %}

{% block content %}
<div class="container mx-auto max-w-3xl px-4 py-6">
    <a href="{% url 'web:index' %}#latest-updates"
       class="text-xs text-[#00adef] font-semibold hover:underline inline-flex items-center gap-1 mb-4">
        <svg class="w-3 h-3 rtl:rotate-180" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
        </svg>
        <span>{% translate "Back to latest updates" %}</span>
    </a>

    <div class="bg-white rounded-xl border border-gray-200 shadow-2xs p-6">
        <h1 class="text-2xl font-black text-gray-900 leading-tight">{{ update.version }}</h1>
        {% if update.date %}
        <p class="text-xs text-gray-400 mt-1 mb-4">{{ update.date|date:"F j, Y" }}</p>
        {% endif %}
        <div class="text-sm text-gray-700 leading-relaxed">{{ update.description|linebreaks }}</div>

        <div class="mt-6 pt-4 border-t border-gray-100">
            <a href="https://www.unicef.org/hope-hct/" target="_blank" rel="noopener"
               class="text-xs text-[#00adef] font-semibold hover:underline">
                {% translate "View all HOPE releases" %}
            </a>
        </div>
    </div>
</div>
{% endblock content %}
