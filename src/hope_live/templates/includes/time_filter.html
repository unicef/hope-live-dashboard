{% load i18n %}

<div id="time-filter-container" data-granularity="{{ granularity|default:'daily' }}" class="mb-6 bg-white rounded-xl shadow-xs border border-gray-200 p-4">
    <div class="flex flex-wrap items-center justify-between gap-4">
        <!-- Preset Buttons -->
        <div class="flex flex-wrap items-center gap-2">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider mr-1">{% translate "Period:" %}</span>
            <button type="button" class="time-preset-btn px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all duration-150 cursor-pointer" data-preset="today" data-daily-only>
                {% translate "Today" %}
            </button>
            <button type="button" class="time-preset-btn px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all duration-150 cursor-pointer" data-preset="this_week" data-daily-only>
                {% translate "This Week" %}
            </button>
            <button type="button" class="time-preset-btn px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all duration-150 cursor-pointer" data-preset="this_month">
                {% translate "This Month" %}
            </button>
            <button type="button" class="time-preset-btn px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all duration-150 cursor-pointer" data-preset="last_3_months">
                {% translate "Last 3 Months" %}
            </button>
            <button type="button" class="time-preset-btn px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all duration-150 cursor-pointer" data-preset="this_year">
                {% translate "This Year" %}
            </button>
            <button type="button" class="time-preset-btn px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all duration-150 flex items-center gap-1.5 cursor-pointer" data-preset="custom">
                <svg class="w-3.5 h-3.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <span>{% translate "Custom Period" %}</span>
            </button>
        </div>

        <!-- Custom Date Range Inputs & Active Label -->
        <div class="flex items-center gap-3">
            <div id="custom-range-inputs" class="hidden items-center gap-2 bg-slate-50 p-1.5 rounded-lg border border-gray-300 shadow-2xs">
                <!-- From Input -->
                <div class="flex items-center gap-1.5">
                    <label for="filter-date-from" class="text-xs font-bold text-gray-600">{% translate "From" %}</label>
                    <div class="relative flex items-center">
                        <input type="date" id="filter-date-from" class="cursor-pointer text-xs font-semibold text-gray-900 bg-white border border-gray-300 rounded-md pl-2 pr-6 py-1.5 focus:outline-hidden focus:ring-2 focus:ring-blue-500 shadow-2xs hover:border-gray-400" />
                        <svg class="w-3.5 h-3.5 text-gray-400 absolute right-2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                </div>

                <!-- To Input -->
                <div class="flex items-center gap-1.5">
                    <label for="filter-date-to" class="text-xs font-bold text-gray-600">{% translate "To" %}</label>
                    <div class="relative flex items-center">
                        <input type="date" id="filter-date-to" class="cursor-pointer text-xs font-semibold text-gray-900 bg-white border border-gray-300 rounded-md pl-2 pr-6 py-1.5 focus:outline-hidden focus:ring-2 focus:ring-blue-500 shadow-2xs hover:border-gray-400" />
                        <svg class="w-3.5 h-3.5 text-gray-400 absolute right-2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                </div>

                <button type="button" id="btn-apply-custom-range" class="cursor-pointer px-3.5 py-1.5 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 active:bg-blue-800 rounded-md shadow-xs transition-all">
                    {% translate "Apply" %}
                </button>
            </div>

            <div class="text-xs font-semibold text-gray-500 flex items-center gap-1">
                <span id="active-range-label" class="font-bold text-gray-900 bg-gray-100 px-2.5 py-1 rounded-md"></span>
            </div>
        </div>
    </div>
</div>
