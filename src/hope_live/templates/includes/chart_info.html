{% load i18n %}
<div class="chart-info relative inline-flex mt-1.5"{% if chart_key %} data-chart-info="{{ chart_key }}"{% endif %}>
  <button type="button" data-chart-info-toggle
      class="inline-flex items-center justify-center w-7 h-7 sm:w-6 sm:h-6 -m-1.5 sm:-m-1 rounded text-black/40 hover:text-black/70 focus:outline-none focus:ring-2 focus:ring-unicef-blue/40"
      aria-label="{% translate 'Methodology' %}" title="{% translate 'Methodology' %}" aria-haspopup="dialog" aria-expanded="false"
      aria-controls="chart-info-{{ chart_key|slugify }}">
    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
  </button>
  <div id="chart-info-{{ chart_key|slugify }}" data-chart-info-panel
      class="fixed z-[1000] hidden w-80 max-w-[calc(100vw-2rem)] max-h-[60vh] overflow-y-auto rounded-lg border border-black/10 bg-white p-4 text-left text-xs leading-relaxed text-black/70 shadow-xl"
      role="dialog" aria-modal="false" aria-label="{% translate 'Methodology' %}" aria-hidden="true">
    <div class="flex items-start justify-between gap-3">
      <p class="text-xs leading-relaxed text-black/70"><span class="font-bold text-black/80">{% translate "Methodology" %}:</span> {{ method }}</p>
      <button type="button" data-chart-info-close
          class="shrink-0 -mr-1 -mt-1 p-1 rounded text-lg leading-none text-black/40 hover:text-black focus:outline-none focus:ring-2 focus:ring-unicef-blue/40"
          aria-label="{% translate 'Close' %}">&times;</button>
    </div>
    {% if note %}
      <p class="mt-2 text-xs leading-relaxed text-black/60"><span class="font-bold text-black/80">{% translate "Note" %}:</span> {{ note }}</p>
    {% endif %}
  </div>
</div>
