{% load i18n %}
<details class="chart-info mt-1.5">
  <summary class="cursor-pointer select-none inline-flex items-center gap-1 text-gray-400 hover:text-gray-600" aria-label="{% translate 'Information' %}">
    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
  </summary>
  <div class="mt-1 text-[11px] text-gray-500 leading-relaxed normal-case tracking-normal font-normal">
    <p class="font-semibold text-gray-700">{{ definition }}</p>
    <p class="mt-0.5"><span class="font-semibold text-gray-600">{% translate "Source" %}:</span> {{ source }}</p>
    <p class="mt-0.5"><span class="font-semibold text-gray-600">{% translate "Method" %}:</span> {{ method }}</p>
  </div>
</details>
