name: Test

on:
  workflow_dispatch:
  push:
    branches: [ "develop" ]
    tags-ignore: [ "**" ]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    defaults:
      run:
        shell: bash
    outputs:
      run_tests: ${{ steps.changes.outputs.run_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - id: changes
        name: Check for file changes
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.ref }}
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  test:
    needs: [ changes ]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: hope_live
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hope_live
      CELERY_BROKER_URL: redis://redis:6379/1
      CACHE_URL: redis://localhost:6379/2
      REDIS_URL: redis://localhost:6379/3
      CONSTANCE_REDIS_URL: redis://localhost:6379/3
      DOCKER_BUILDKIT: 1
      STREAMING_BROKER_URL: "rabbit://guest:guest@localhost:5672?exchange=hope_live"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: "${{ vars.DOCKERHUB_ORGANIZATION }}/${{ vars.DOCKERHUB_REPOSITORY }}"
          tags: |
            type=ref,event=branch
            type=ref,event=pr

      - name: DockerHub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: calc
        shell: bash
        run: |
          IMAGE=$(echo '${{env.DOCKER_METADATA_OUTPUT_JSON}}' | jq -r '.tags[0]')
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Build Test Image
        run: |
             docker build \
                --target tests \
                -t ${{env.IMAGE}} \
                --cache-from "type=gha" \
                --cache-to "type=gha,mode=max" \
                -f docker/Dockerfile .

      - name: Run Test suite
        run: |
            mkdir -p output
            docker run --rm \
              --network host \
              -e PYTHONPATH=/app/src \
              -e DATABASE_URL=${DATABASE_URL} \
              -e CELERY_BROKER_URL=${CELERY_BROKER_URL} \
              -e CACHE_URL=${CACHE_URL} \
              -e REDIS_URL=${REDIS_URL} \
              -e CONSTANCE_REDIS_URL=${CONSTANCE_REDIS_URL} \
              -e STREAMING_BROKER_URL=${STREAMING_BROKER_URL} \
              -e SECRET_KEY=super-secret-key-just-for-testing \
              -v "./output/:/app/output" \
              -v "./src/:/app/src" \
              -v "./tests:/app/tests" \
              -v "./pytest.ini:/app/pytest.ini" \
              -v "./tox.ini:/app/tox.ini" \
              -v "./pyproject.toml:/app/pyproject.toml" \
              -t ${{env.IMAGE}} \
              tox -e tests

      - name: Upload pytest test results
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-tests
          path: junit.xml
        if: ${{ always() }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          files: ./output/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: false
          name: codecov-${{env.GITHUB_REF_NAME}}
