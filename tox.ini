[tox]
requires =
    tox>=4.2
    tox-uv>=1.25
env_list =
    lint
    d52-py313
    docs
    mypy
    pkg_meta

[testenv]
description = run tests
base_python = python3.13
deps =
    boto3>=1.34
    celery>=5.3
    channels>=4
    channels-redis>=4.1
    click>=8.1
    coverage>=7.4
    daphne>=4
    django==5.2.*
    django-allauth>=0.58
    django-celery-results>=2.5
    django-constance[database,redis]>=2.9
    django-cors-headers>=4.3
    django-debug-toolbar>=4.2
    django-extensions>=3.2
    django-filter>=23.5
    django-redis>=5.3
    django-storages>=1.14
    django-stubs>=4.2
    django-webtest>=1.9
    djangorestframework>=3.14
    drf-spectacular>=0.27
    factory-boy>=3.3
    gunicorn>=21.2
    httpx>=0.26
    mypy>=1.8
    pika>=1.3
    pre-commit-uv>=4.1.1
    psycopg2-binary>=2.9
    pytest>=7.4
    pytest-cov>=4.1
    pytest-django>=4.7
    pytest-xdist>=3.5
    python-dotenv>=1
    python-json-logger>=2
    redis>=5
    responses>=0.24
    ruff>=0.3
    sentry-sdk>=1.40
    social-auth-app-django>=5.3
    types-PyYAML>=6
    types-python-dateutil>=2.8
    types-pytz>=2023.3
    types-redis>=4.6
    types-requests>=2.31
    uvloop>=0.19
    whitenoise>=6.6
pass_env =
    BROKER_URL
    CI
    CONSTANCE_REDIS_URL
    DATABASE_HOPE_URL=postgis://hopeuser:Kigabo47**@localhost:5433/hopedb2
    DATABASE_URL
    REDIS_URL
set_env =
    PYTHONDONTWRITEBYTECODE = 1
    PYTHONWARNINGS = ignore::DeprecationWarning
    SECRET_KEY = "super_secret_key_just_for_testing"
commands =
    {posargs:pytest tests -rw --headless --cov-report=xml  --junit-xml=junit.xml -o junit_family=legacy}
dependency_groups = dev

[testenv:lint]
description = run static analysis and style check using ruff
skip_install = true
deps =
    pre-commit-uv>=4.1.1
commands =
    pre-commit run --all-files --show-diff-on-failure
dependency_groups = dev

[testenv:docs]
description = build mkdocs documentation
skip_install = false
deps =
    mkdocs>=1.5
    mkdocs-material>=9.5
commands =
    mkdocs build {posargs:}
dependency_groups = docs

[testenv:mypy]
description = run type check on code base
base_python = python3.13
deps =
    {[testenv]deps}
commands =
    mypy --config-file mypy.ini {posargs:}
dependency_groups =
    dev
    type-check

[testenv:pkg_meta]
runner = uv-venv-lock-runner
description = check that python package
skip_install = true
deps =
    check-wheel-contents>=0.6
    twine>=5.1.1
    uv>=0.5
commands =
    uv build --sdist -q --out-dir {env_tmp_dir} .
    uvx twine check {env_tmp_dir}{/}*
    uvx check-wheel-contents --ignore W002,W004,W009,W004 {env_tmp_dir}
    uv pip install --no-binary hope_live_dashboard --find-links {env_tmp_dir} hope_live_dashboard

[testenv:type-d52]
base_python = python3.13
deps =
    {[testenv]deps}
    django==5.2.*
    django-stubs>=4.2
    mypy>=1.8
commands =
    mypy --config-file mypy.ini -v {posargs:}
dependency_groups =
    dev
    type-check
