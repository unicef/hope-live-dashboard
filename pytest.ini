[pytest]
DJANGO_SETTINGS_MODULE = hope_live.config.settings
norecursedirs = data .tox
pythonpath = ./src
django_find_project = false

addopts =
    -vv
    --reuse-db
    --tb=short
    --maxfail=20
    --nomigrations
    --capture=no
    --cov-report=html
    --cov-report=xml
    --cov-config=tests/.coveragerc
    --cov=hope_live
    --echo-version=django
    --echo-env PYTHONPATH
    --echo-version=hope_live

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
