[pytest]
norecursedirs = data .tox _plugin_template .idea  node_modules ~*
django_find_project = false
DJANGO_SETTINGS_MODULE = hope_live.config.settings
log_format = %(asctime)s %(levelname)s %(message)s
log_level = CRITICAL
pythonpath = tests/extras src/
log_date_format = %Y-%m-%d %H:%M:%S

addopts =
    -vv
    --tb=short
    --maxfail=20
    --nomigrations
    --capture=no
    --cov-report=html:output/htmlcov
    --cov-report=xml:output/coverage.xml
    --cov-config=tests/.coveragerc
    --cov=hope_live
    --echo-version=django
    --echo-env PYTHONPATH
    --echo-version=hope_live

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    selenium: marks tests that require selenium browser
