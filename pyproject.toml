[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs>=0.4",
  "hatchling>=1.25",
]

[project]
name = "hope-live-dashboard"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [
  "version",
]
dependencies = [
  "channels",
  "channels-redis",
  "click",
  "daphne",
  "django>=5.2.6,<6",
  "django-admin-extra-buttons",
  "django-adminactions",
  "django-adminfilters>=2.7",
  "django-celery-beat>=2.8.1",
  "django-celery-boost>=0.7",
  "django-constance",
  "django-csp",
  "django-debug-toolbar",
  "django-environ",
  "django-extensions>=4.1",
  "django-flags",
  "django-online-issues[github]",
  "django-redis",
  "django-regex",
  "django-smart-env",
  "django-streaming[rabbitmq]",
  "django-stubs",
  "django-stubs-ext",
  "django-tailwind",
  "django-timezone-field",
  "django-unfold",
  "django-widget-tweaks",
  "drf-spectacular>=0.29",
  "psycopg2-binary>=2.9.10",
  "redis",
  "sentry-sdk",
  "social-auth-app-django",
  "tenacity>=9.1.4",
  "unicef-security>=1.8",
  "whitenoise>=6.12",
]
urls.Documentation = "https://github.com/UNICEF/hope-live-dashboard"
urls.Homepage = "https://github.com/UNICEF/hope-live-dashboard"
scripts.live = "hope_live.__cli__:cli"

[dependency-groups]
dev = [
  "django-browser-reload>=1.19",
  "django-webtest>=1.9.13",
  "factory-boy>=3.3.3",
  "freezegun>=1.5.5",
  "pre-commit>=4.3",
  "pyquery>=2.0.1",
  "pytest>=8.4.2",
  "pytest-cov>=7",
  "pytest-coverage>=0",
  "pytest-django>=4.11.1",
  "pytest-docker>=3.1.1",
  "pytest-echo>=2.0.1",
  "pytest-factoryboy>=2.8.1",
  "pytest-xdist>=3.8",
  "responses>=0.25.8",
  "ruff>=0.13.1",
  "seleniumbase>=4.41.6",
  "tox>=4.30.2",
]
docs = [
  "markupsafe>=2.1.5",
  "mdx-gh-links>=0.4",
  "mkdocs>=1.6.1",
  "mkdocs-autolinks-plugin>=0.7.1",
  "mkdocs-awesome-pages-plugin>=2.10.1",
  "mkdocs-click>=0.8.1",
  "mkdocs-embed-external-markdown>=3.0.2",
  "mkdocs-ezglossary-plugin>=1.6.10",
  "mkdocs-ezlinks-plugin>=0.1.14",
  "mkdocs-gen-files>=0.5",
  "mkdocs-get-deps>=0.2",
  "mkdocs-include-markdown-plugin>=6.2.2",
  "mkdocs-link-marker>=0.1.3",
  "mkdocs-macros-plugin>=1.0.5",
  "mkdocs-material>=9.5.15",
  "mkdocs-minify-plugin>=0.8",
  "mkdocs-redirects>=1.2.1",
  "mkdocs-simple-hooks>=0.1.5",
  "mkdocstrings[python]>=0.27",
  "pymdown-extensions>=10.14",
]
arch = [
  "import-linter>=2.5",
]
type-check = [
  "django-stubs[compatible-mypy]",
  "mypy",
  "types-channels",
  "types-markdown",
  "types-pika",
  "types-python-dateutil",
  "types-redis",
  "types-requests",
]

[tool.hatch]
build.hooks.vcs.version-file = "src/hope_live/version.py"
build.targets.sdist.ignore-vcs = true
build.targets.sdist.only-include = [ "src/hope_live" ]
build.targets.wheel.packages = [ "src/hope_live" ]
version.source = "vcs"
raw-options = { root = "../.." }
